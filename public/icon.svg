<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#252E58"/>
      <stop offset="100%" stop-color="#101426"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885"/>
      <stop offset="100%" stop-color="#FFC857"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A27BFF"/>
      <stop offset="100%" stop-color="#8257FF"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.4"/>

  <!-- Detective Hat Silhouette -->
  <path d="M156 220 C156 160 210 130 256 130 C302 130 356 160 356 220 Z" fill="#1A2140" stroke="url(#purpleGrad)" stroke-width="8"/>
  <ellipse cx="256" cy="220" rx="130" ry="24" fill="#202952" stroke="url(#purpleGrad)" stroke-width="6"/>

  <!-- Magnifying Glass Icon -->
  <circle cx="270" cy="280" r="90" fill="none" stroke="url(#goldGrad)" stroke-width="22"/>
  <circle cx="270" cy="280" r="76" fill="#8257FF" opacity="0.25"/>
  <line x1="334" y1="344" x2="410" y2="420" stroke="url(#goldGrad)" stroke-width="26" stroke-linecap="round"/>

  <!-- Question Mark Inside Magnifying Glass -->
  <text x="270" y="322" font-family="Arial, sans-serif" font-size="108" font-weight="900" fill="#FFFFFF" text-anchor="middle">?</text>
</svg>
